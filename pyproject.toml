[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tark-phase1-backend"
version = "0.1.0"
description = "TARK SIH26007 Phase 1 research-prototype decision backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.7", "cbor2>=5.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
gnss = ["pyserial>=3.5"]
camera = ["opencv-python-headless>=4.8"]
imu = ["smbus2>=0.4", "adafruit-blinka>=8", "adafruit-circuitpython-bno055>=5"]
thermal = ["smbus2>=0.4", "adafruit-blinka>=8", "adafruit-circuitpython-mlx90640>=1"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
